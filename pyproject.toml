[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smartdialer"
version = "0.1.0"
description = "Safety-first predictive smart dialer prototype"
requires-python = ">=3.11"
dependencies = [
    "asyncpg>=0.29",
    "SQLAlchemy>=2.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.setuptools]
packages = [
    "smartdialer",
    "provider",
    "pacing",
    "simulator",
    "loadtest",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]